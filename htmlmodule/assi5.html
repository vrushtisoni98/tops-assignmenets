<!DOCTYPE html>
<html>
<head>
    <title>Course Schedule</title>
    <style>
        table {
            border-collapse: collapse;
            width: 60%;
        }
        table, th, td {
            border: 1px solid black;
        }
        th, td {
            padding: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Course Schedule</h1>

    <table>
        <tr>
            <th>Day</th>
            <th>Course Name</th>
            <th>Time</th>
        </tr>
        <tr>
            <td>Monday</td>
            <td>HTML Basics</td>
            <td>10:00 AM - 11:00 AM</td>
        </tr>
        <tr>
            <td>Wednesday</td>
            <td>CSS Fundamentals</td>
            <td>11:00 AM - 12:00 PM</td>
        </tr>
        <tr>
            <td>Friday</td>
            <td>JavaScript Intro</td>
            <td>12:00 PM - 1:00 PM</td>
        </tr>
    </table>

</body>
</html>
