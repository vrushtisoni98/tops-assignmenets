<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Styled Page</title>
</head>

<body style="background-color: #e6f2ff;">

    <!-- Main Heading -->
    <h1 style="text-align: center; font-size: 36px;">
        Welcome to My Styled Page
    </h1>

    <!-- Image with padding and border -->
    <div style="text-align: center;">
        <img src="https://via.placeholder.com/300"
             alt="Sample Image"
             style="padding: 10px; border: 3px solid black;">
    </div>

    <!-- Paragraph with custom font color and italic text -->
    <p style="color: #333399; font-style: italic; font-size: 18px; text-align: center;">
        This paragraph demonstrates inline CSS with custom color and italic styling.
    </p>

</body>
</html>
